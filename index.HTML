<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 账号工具（增强版）</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #1a1a2e; color: #eee; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1, h2 { color: #ffd700; border-bottom: 2px solid #ffd700; padding-bottom: 8px; }
        .card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        input, button, select { padding: 10px 16px; border: none; border-radius: 8px; font-size: 16px; }
        input, select { background: #0f3460; color: #fff; flex: 1 1 150px; }
        button { background: #e94560; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; transform: scale(1.02); }
        button.secondary { background: #533483; }
        button.success { background: #2ecc71; }
        button.check { background: #3498db; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2a4a; }
        th { background: #0f3460; color: #ffd700; }
        td { word-break: break-all; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge-new { background: #2ecc71; color: #000; }
        .badge-7d { background: #f1c40f; color: #000; }
        .badge-15d { background: #e67e22; color: #fff; }
        .badge-old { background: #7f8c8d; color: #fff; }
        .warehouse-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
        .warehouse-category { background: #1a1a40; border-radius: 10px; padding: 15px; border-left: 5px solid #ffd700; }
        .warehouse-category h3 { margin-top: 0; display: flex; justify-content: space-between; }
        .account-item { background: #0f3460; border-radius: 6px; padding: 8px 12px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; flex-wrap: wrap; }
        .account-item .actions button { padding: 4px 10px; font-size: 12px; margin-left: 5px; background: #e94560; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
        .account-item .actions button.copy { background: #3498db; }
        .empty-msg { color: #aaa; font-style: italic; }
        .footer-note { margin-top: 30px; color: #888; text-align: center; font-size: 14px; }
        .status-available { color: #2ecc71; font-weight: bold; }
        .status-taken { color: #e74c3c; font-weight: bold; }
        .status-invalid { color: #f39c12; font-weight: bold; }
        .status-error { color: #e74c3c; font-weight: bold; }
        .status-checking { color: #f1c40f; }
        .error-detail { font-size: 12px; color: #ff6b6b; display: block; }
        .check-btn { background: #3498db; }
    </style>
</head>
<body>

<h1>🎮 Roblox 账号工具箱</h1>
<p style="color: #aaa;">生成随机账号 · 自动检查可用性 · 智能分类仓库</p>

<!-- ===== 生成器 ===== -->
<div class="card">
    <h2>🔧 批量生成与检查</h2>
    <div class="flex-row">
        <label style="display:flex;align-items:center;gap:8px;">
            生成数量
            <input type="number" id="genCount" value="5" min="1" max="20" style="width:80px;">
        </label>
        <button onclick="generateAndCheck()">✨ 生成并检查</button>
        <button class="secondary" onclick="addAllAvailableToWarehouse()">📦 加入可用账号至仓库</button>
        <button class="success" onclick="clearGenerated()">🗑️ 清空列表</button>
        <span id="checkStatus" style="margin-left:15px;color:#aaa;"></span>
    </div>
    <div style="margin-top:10px; overflow-x:auto;">
        <table id="genTable">
            <thead><tr><th>#</th><th>用户名</th><th>密码</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="genBody"></tbody>
        </table>
        <p id="genStatus" style="color:#aaa; margin-top:8px;">尚未生成</p>
    </div>
</div>

<!-- ===== 仓库 ===== -->
<div class="card">
    <h2>📦 账号仓库</h2>
    <div class="flex-row" style="margin-bottom:15px;">
        <button onclick="addManualAccount()">➕ 手动添加账号</button>
        <button class="secondary" onclick="exportWarehouse()">📤 导出全部 (JSON)</button>
        <button class="secondary" onclick="importWarehouse()">📥 导入 JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="handleImport(event)">
    </div>
    <div class="warehouse-grid" id="warehouseContainer"></div>
    <p id="warehouseStatus" style="color:#aaa; margin-top:10px;">加载中...</p>
</div>

<div class="footer-note">
    ⚠️ 所有数据仅保存在你的浏览器本地 (localStorage)。<br>
    若检查全部失败，请尝试 <strong>使用 Live Server 打开</strong> 或切换网络环境。<br>
    遇到错误时请按 F12 查看控制台具体报错信息。
</div>

<script>
    // ---------- 核心数据 ----------
    let generatedAccounts = [];
    let warehouse = [];
    const STORAGE_KEY = 'roblox_warehouse';

    // ---------- 工具函数 ----------
    function loadWarehouse() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            try { warehouse = JSON.parse(data); } catch(e){ warehouse = []; }
        } else {
            warehouse = [];
        }
        renderWarehouse();
    }
    function saveWarehouse() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(warehouse));
        renderWarehouse();
    }

    function randomUsername() {
        const words = ['Cool','Pro','Star','Sky','Blue','Red','Game','Play','Fun','Sun',
                       'Moon','Fire','Ice','Wind','Lord','King','Queen','Ninja','Panda','Tiger',
                       'Wolf','Hawk','Shadow','Light','Storm','Dragon','Phoenix','Crystal','Thunder'];
        let name = '';
        while (true) {
            const w1 = words[Math.floor(Math.random() * words.length)];
            const w2 = Math.random() > 0.5 ? words[Math.floor(Math.random() * words.length)] : '';
            let base = w1 + w2;
            const num = Math.floor(Math.random() * 10000);
            name = base + num;
            if (name.length >= 3 && name.length <= 20 && !/^\d+$/.test(name)) {
                return name;
            }
        }
    }

    function randomPassword(length = 12) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let pwd = '';
        for (let i = 0; i < length; i++) {
            pwd += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return pwd;
    }

    function getAccountInfo(registerDateStr) {
        const now = new Date();
        const reg = new Date(registerDateStr);
        const diffMs = now - reg;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        let category = '', badge = '';
        if (diffDays === 0) { category = '新号(0天)'; badge = 'badge-new'; }
        else if (diffDays >= 1 && diffDays <= 7) { category = '7天号(1-7天)'; badge = 'badge-7d'; }
        else if (diffDays >= 8 && diffDays <= 15) { category = '15天号(8-15天)'; badge = 'badge-15d'; }
        else { category = '老号(>15天)'; badge = 'badge-old'; }
        return { days: diffDays, category, badge };
    }

    // ---------- 检查用户名（增强错误处理） ----------
    async function checkUsernameAvailability(username) {
        const url = `https://auth.roblox.com/v1/usernames/validate?request.username=${encodeURIComponent(username)}`;
        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            // 打印响应状态便于调试
            console.log(`[${username}] HTTP状态:`, response.status);
            
            if (!response.ok) {
                // 如果状态码不是200，记录详细信息
                const text = await response.text();
                console.error(`[${username}] 错误响应:`, text);
                return { status: 'Error', message: `HTTP ${response.status}: ${text.substring(0,50)}` };
            }
            
            const data = await response.json();
            console.log(`[${username}] API返回:`, data);
            
            // 判断status字段
            if (data.status) {
                return { status: data.status, message: data.message || data.status };
            } else {
                // 如果返回格式异常
                return { status: 'Error', message: 'API返回格式异常: ' + JSON.stringify(data).substring(0,50) };
            }
        } catch (error) {
            console.error(`[${username}] 网络错误:`, error);
            return { status: 'Error', message: '网络错误: ' + error.message };
        }
    }

    // ---------- 生成并检查 ----------
    async function generateAndCheck() {
        const count = parseInt(document.getElementById('genCount').value) || 5;
        if (count > 20) {
            alert('建议单次生成不超过20个，以免被限流');
            return;
        }
        const list = [];
        const statusEl = document.getElementById('checkStatus');
        statusEl.textContent = '⏳ 正在生成...';

        // 生成用户名
        for (let i = 0; i < count; i++) {
            list.push({ username: randomUsername(), password: randomPassword(), status: 'checking', statusMessage: '' });
        }
        generatedAccounts = list;
        renderGenerated();
        statusEl.textContent = `⏳ 正在检查 0/${count}`;

        // 逐个检查
        for (let i = 0; i < list.length; i++) {
            const result = await checkUsernameAvailability(list[i].username);
            list[i].status = result.status;
            list[i].statusMessage = result.message || '';
            renderGenerated();
            statusEl.textContent = `⏳ 正在检查 ${i+1}/${count}`;
            // 延迟800ms，避免限流
            await new Promise(resolve => setTimeout(resolve, 800));
        }

        const available = list.filter(a => a.status === 'Available').length;
        statusEl.textContent = `✅ 检查完成！可用: ${available} 个，失败: ${list.filter(a => a.status === 'Error').length} 个`;
        renderGenerated();
    }

    // 单独重新检查某个账号（用于重试）
    async function recheckAccount(index) {
        const acc = generatedAccounts[index];
        if (!acc) return;
        acc.status = 'checking';
        acc.statusMessage = '';
        renderGenerated();
        const result = await checkUsernameAvailability(acc.username);
        acc.status = result.status;
        acc.statusMessage = result.message || '';
        renderGenerated();
    }

    function renderGenerated() {
        const tbody = document.getElementById('genBody');
        const status = document.getElementById('genStatus');
        if (generatedAccounts.length === 0) {
            tbody.innerHTML = '';
            status.textContent = '暂无生成记录';
            return;
        }
        let html = '';
        generatedAccounts.forEach((acc, idx) => {
            let statusText = acc.status || '未知';
            let statusClass = '';
            let detailHtml = '';
            if (statusText === 'Available') { 
                statusText = '✅ 可用'; 
                statusClass = 'status-available'; 
            } else if (statusText === 'Taken') { 
                statusText = '❌ 已被占用'; 
                statusClass = 'status-taken'; 
            } else if (statusText === 'Invalid') { 
                statusText = '⚠️ 无效用户名'; 
                statusClass = 'status-invalid'; 
            } else if (statusText === 'checking') { 
                statusText = '⏳ 检查中...'; 
                statusClass = 'status-checking'; 
            } else if (statusText === 'Error') { 
                statusText = '❌ 错误'; 
                statusClass = 'status-error';
                detailHtml = `<span class="error-detail">${acc.statusMessage || '未知错误'}</span>`;
            } else { 
                statusText = '❓ '+statusText; 
            }

            html += `<tr>
                <td>${idx+1}</td>
                <td>${acc.username}</td>
                <td>${acc.password}</td>
                <td class="${statusClass}">${statusText}${detailHtml}</td>
                <td>
                    <button onclick="copyText('${acc.password}')" style="padding:4px 10px;font-size:12px;">复制密码</button>
                    ${acc.status === 'Error' ? `<button onclick="recheckAccount(${idx})" style="padding:4px 10px;font-size:12px;background:#f39c12;">重试</button>` : ''}
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
        const available = generatedAccounts.filter(a => a.status === 'Available').length;
        const errors = generatedAccounts.filter(a => a.status === 'Error').length;
        status.textContent = `共 ${generatedAccounts.length} 个账号，可用: ${available} 个，错误: ${errors} 个`;
    }

    function clearGenerated() {
        generatedAccounts = [];
        renderGenerated();
        document.getElementById('checkStatus').textContent = '';
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('已复制到剪贴板');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('已复制');
        });
    }

    // ---------- 仅将可用账号加入仓库 ----------
    function addAllAvailableToWarehouse() {
        const available = generatedAccounts.filter(a => a.status === 'Available');
        if (available.length === 0) {
            alert('没有可用的账号可添加');
            return;
        }
        const now = new Date().toISOString();
        let added = 0;
        available.forEach(acc => {
            const exist = warehouse.some(a => a.username === acc.username);
            if (!exist) {
                warehouse.push({
                    username: acc.username,
                    password: acc.password,
                    registerDate: now
                });
                added++;
            }
        });
        if (added > 0) {
            saveWarehouse();
            alert(`成功添加 ${added} 个可用账号到仓库`);
        } else {
            alert('所有可用账号已存在于仓库，无新增');
        }
    }

    // ---------- 手动添加 ----------
    function addManualAccount() {
        const username = prompt('请输入用户名（必填）');
        if (!username) return;
        const password = prompt('请输入密码（必填）');
        if (!password) return;
        const dateStr = prompt('请输入注册日期 (留空则使用当前时间)', new Date().toISOString().slice(0,10));
        let registerDate;
        if (dateStr) {
            const d = new Date(dateStr);
            if (!isNaN(d)) registerDate = d.toISOString();
            else registerDate = new Date().toISOString();
        } else {
            registerDate = new Date().toISOString();
        }
        warehouse.push({ username, password, registerDate });
        saveWarehouse();
        alert('添加成功');
    }

    function deleteAccount(index) {
        if (confirm('确认删除该账号？')) {
            warehouse.splice(index, 1);
            saveWarehouse();
        }
    }

    function exportWarehouse() {
        if (warehouse.length === 0) { alert('仓库为空'); return; }
        const blob = new Blob([JSON.stringify(warehouse, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'roblox_warehouse.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importWarehouse() {
        document.getElementById('importFile').click();
    }

    function handleImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data) && data.every(a => a.username && a.password && a.registerDate)) {
                    if (confirm(`将导入 ${data.length} 个账号，是否覆盖当前仓库？\n（取消则追加）`)) {
                        warehouse = data;
                    } else {
                        warehouse = warehouse.concat(data);
                    }
                    saveWarehouse();
                    alert('导入成功');
                } else {
                    alert('数据格式无效');
                }
            } catch(err) {
                alert('解析 JSON 失败');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function renderWarehouse() {
        const container = document.getElementById('warehouseContainer');
        const status = document.getElementById('warehouseStatus');
        if (!warehouse.length) {
            container.innerHTML = `<div style="grid-column:1/-1; color:#aaa; text-align:center; padding:30px;">仓库为空</div>`;
            status.textContent = '共 0 个账号';
            return;
        }
        const groups = {
            '新号(0天)': [],
            '7天号(1-7天)': [],
            '15天号(8-15天)': [],
            '老号(>15天)': []
        };
        warehouse.forEach((acc, index) => {
            const info = getAccountInfo(acc.registerDate);
            groups[info.category].push({ ...acc, index, days: info.days, badge: info.badge });
        });
        let html = '';
        for (const [cat, items] of Object.entries(groups)) {
            html += `<div class="warehouse-category">
                <h3><span>${cat}</span> <span style="font-weight:normal;font-size:14px;color:#aaa;">${items.length} 个</span></h3>
                <div>`;
            if (items.length === 0) {
                html += `<div class="empty-msg">暂无</div>`;
            } else {
                items.forEach(item => {
                    html += `<div class="account-item">
                        <div>
                            <strong>${item.username}</strong>
                            <span style="margin-left:10px;color:#ccc;font-size:13px;">${item.password}</span>
                            <span class="badge ${item.badge}" style="margin-left:10px;">${item.days}d</span>
                        </div>
                        <div class="actions">
                            <button class="copy" onclick="copyText('${item.password}')">复制密码</button>
                            <button onclick="deleteAccount(${item.index})">删除</button>
                        </div>
                    </div>`;
                });
            }
            html += `</div></div>`;
        }
        container.innerHTML = html;
        status.textContent = `共 ${warehouse.length} 个账号`;
    }

    // 暴露函数到全局
    window.generateAndCheck = generateAndCheck;
    window.addAllAvailableToWarehouse = addAllAvailableToWarehouse;
    window.clearGenerated = clearGenerated;
    window.copyText = copyText;
    window.addManualAccount = addManualAccount;
    window.deleteAccount = deleteAccount;
    window.exportWarehouse = exportWarehouse;
    window.importWarehouse = importWarehouse;
    window.handleImport = handleImport;
    window.recheckAccount = recheckAccount;

    // ---------- 初始化 ----------
    loadWarehouse();
    renderGenerated();
</script>

</body>
</html>
